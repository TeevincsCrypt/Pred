services:
  - type: web
    name: pred
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: pred-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PRED_MODE
        value: live
      - key: SEC_USER_AGENT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
